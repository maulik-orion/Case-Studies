<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales and Marketing QBR</title>
<style>
:root{
  color-scheme: dark;
  --page:#08111f; --slide:#0e1a2e; --surface:#13223a; --surface-2:#172a47;
  --ink:#f2f5fa; --ink-2:#b7c2d4; --muted:#8494ab;
  --grid:#22324d; --axis:#33445f; --ring:rgba(255,255,255,.08);
  --amber:#fab219; --good:#0ca30c; --good-text:#3fcf6a; --bad-text:#ef7b7b;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --up:#3987e5; --down:#e66767; --total:#6f82a0;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font-family:var(--sans)}
button,select{font-family:inherit}
/* ---------- navigation ---------- */
#nav{position:sticky;top:0;z-index:20;background:#060d18;border-bottom:1px solid var(--ring);
  display:flex;align-items:center;gap:8px;padding:10px 14px;overflow-x:auto}
#nav .brand{font-size:12px;color:var(--ink-2);line-height:1.2;min-width:128px;padding-right:4px}
#nav .brand b{display:block;color:var(--ink);font-size:14px}
.navbtn{flex:1 1 auto;max-width:132px;white-space:nowrap;min-height:54px;min-width:0;padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);
  background:var(--surface);color:var(--ink-2);cursor:pointer;text-align:left;font-size:14px;line-height:1.15}
.navbtn .n{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn[aria-current="true"]{background:#1d3357;color:var(--ink);border-color:var(--amber);box-shadow:inset 0 -3px 0 var(--amber)}
.navbtn:focus-visible,.ctl:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.arrow{flex:0 0 auto;min-height:54px;min-width:54px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:var(--surface);
  color:var(--ink);font-size:22px;cursor:pointer}
.arrow:hover{background:var(--surface-2)}
.spacer{flex:1 1 auto}
.printbtn{flex:0 0 auto;min-height:54px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px}
/* ---------- stage ---------- */
#stage{position:relative;width:100%;overflow:hidden}
#canvas{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
.slide{position:absolute;inset:0;background:var(--slide);border-radius:6px;visibility:hidden;padding:20px 30px 0 30px;
  display:flex;flex-direction:column}
.slide.active{visibility:visible}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;height:60px}
.kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.title{font-size:24px;font-weight:600;margin:3px 0 0}
.q{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.filters{display:flex;gap:8px;align-items:flex-end;flex-wrap:nowrap}
.filters label{display:flex;flex-direction:column;font-size:10.5px;color:var(--muted);letter-spacing:.04em;gap:3px}
.filters select{height:30px;background:#0b1628;color:var(--ink);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:0 6px;font-size:12.5px;min-width:92px}
.body{display:grid;grid-template-columns:352px 1fr;gap:14px;height:574px;margin-top:10px}
.left{display:flex;flex-direction:column;gap:12px;min-height:0}
.hero{background:var(--surface);border-radius:10px;padding:14px 16px;border:1px solid var(--ring)}
.hero .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero .val{font-family:var(--serif);font-size:54px;line-height:1.05;margin:6px 0 4px;font-weight:400}
.hero .sowhat{font-family:var(--serif);font-style:italic;font-size:15.5px;line-height:1.35;color:var(--ink);margin-top:8px}
.hero .sowhat::before{content:"\25C6";color:var(--amber);font-style:normal;font-size:12px;margin-right:6px;position:relative;top:-1px}
.chip{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.chip.good{color:var(--good-text)} .chip.bad{color:var(--bad-text)} .chip.flat{color:var(--ink-2)}
.chip .vs{font-weight:400;color:var(--muted)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}
.tile{background:var(--surface);border-radius:10px;padding:10px 12px;border:1px solid var(--ring);display:flex;flex-direction:column;min-width:0}
.tile .lab{font-size:11.5px;color:var(--ink-2)}
.tile .val{font-size:22px;font-weight:600;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val.txt{font-size:15px;font-weight:600;white-space:normal;line-height:1.2}
.tile .note{font-size:10.5px;color:var(--muted);margin-top:2px}
.tile svg{margin-top:auto}
.right{display:grid;grid-template-rows:1fr 1fr;gap:12px;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-height:0}
.right.L{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.right.L>.panel:first-child{grid-row:1/3}
.right.L>.row2{display:contents}
.panel{background:var(--surface);border-radius:10px;border:1px solid var(--ring);padding:10px 12px 6px;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;min-height:30px}
.pt{font-size:13px;font-weight:600}
.ps{font-size:11px;color:var(--muted);margin-top:1px}
.ctl{font-size:11px;color:var(--ink-2);background:transparent;border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:3px 8px;cursor:pointer;flex:0 0 auto}
.ctl:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
.plot{flex:1;min-height:0;position:relative}
.plot svg{display:block}
.tbl{position:absolute;inset:0;overflow:auto;display:none;font-size:11.5px}
.tbl table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:4px 8px;border-bottom:1px solid var(--grid);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface)}
.panel.showtbl .tbl{display:block;z-index:2;background:var(--surface)} .panel.showtbl .plot > div:not(.tbl){visibility:hidden}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:20px}
.foot{min-height:26px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:10px;line-height:1.3;color:var(--muted);margin-top:auto;padding-bottom:6px}
.foot span:last-child{white-space:nowrap;flex:0 0 auto}
.foot span:first-child{flex:1 1 auto;min-width:0}
.foot span.tagline{flex:0 0 auto;font-size:9px;text-align:center;white-space:nowrap;color:var(--muted)}
.axis text{fill:var(--muted);font-size:10.5px}
.lbl{fill:var(--ink-2);font-size:10.5px}
.lblb{fill:var(--ink);font-size:11px;font-weight:600}
.leg text{fill:var(--ink-2);font-size:10.5px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#050b16;border:1px solid rgba(255,255,255,.18);border-radius:8px;
  padding:8px 10px;font-size:12px;color:var(--ink);display:none;min-width:130px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#tip .tt{color:var(--ink-2);font-size:11px;margin-bottom:4px}
#tip .tr{display:flex;align-items:center;gap:8px;margin:2px 0}
#tip .tr i{display:inline-block;width:12px;height:3px;border-radius:2px}
#tip .tr b{font-variant-numeric:tabular-nums}
#tip .tr span{color:var(--ink-2)}
@media print{
  @page{size:1280px 720px;margin:0}
  #nav,#tip{display:none}
  #stage{height:auto!important;overflow:visible}
  #canvas{position:static;transform:none!important;width:1280px;height:auto}
  .slide{position:relative;visibility:visible;width:1280px;height:720px;page-break-after:always;border-radius:0}
  .ctl{display:none}
}
</style>
</head>

/* ---------------- formatting ---------------- */
const isNum = v => v !== null && v !== undefined && isFinite(v);
const f$ = v => { if(!isNum(v)) return 'n/a'; const a=Math.abs(v), s=v<0?'-':'';
  if(a>=1e6) return s+'$'+(a/1e6).toFixed(1)+'M'; if(a>=1e3) return s+'$'+Math.round(a/1e3)+'K'; return s+'$'+Math.round(a); };

  if(a>=1e6) return s+'$'+(+(a/1e6).toFixed(1))+'M'; if(a>=1e3) return s+'$'+(+(a/1e3).toFixed(1))+'K'; return s+'$'+Math.round(a); };

/* ---------------- filter selection ---------------- */
function regs(f){ return f.region==='All' ? [0,1,2,3,4] : [REG.indexOf(f.region)]; }

function qRange(f){ return range(NQ - f.range, CUR); }

/* ---------------- scales ---------------- */
function nice(min, max, n, int){
  if(min===max){ max = max===0 ? 1 : max*1.1; min = Math.min(0,min); }
  const rough=(max-min)/n, mag=Math.pow(10,Math.floor(Math.log10(rough))), nr=rough/mag;
  let step=(nr<1.5?1:nr<3?2:nr<7?5:10)*mag; if(int) step=Math.max(1,Math.round(step));
  const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step, ticks=[];
  for(let v=lo; v<=hi+step*1e-6; v+=step) ticks.push(+v.toFixed(10));
  return {lo, hi, ticks};

/* ---------------- chart base ---------------- */
function frame(host, spec){

}

  const g=s('g',{class:'leg'},svg); let cx=x, cy=y, rows=1;

    t.setAttribute('x',cx+(shape==='line'?19:15)); cx+=w+14;
  }

}
function setTable(panel, cols, rows){
  const box=panel.querySelector('.tbl'); box.replaceChildren();

function emptyState(host, msg){ host.replaceChildren(); host.appendChild(h('div','empty',msg)); }

/* line chart: cats, series[{name,color,values}], fmt */
function lineChart(panel, spec){
  spec={...spec, series:spec.series.filter(x=>x.values.some(isNum))};
  if(!spec.series.length){ emptyState(panel.querySelector('.plot'),'No data for this selection'); return; }

  const ax=s('g',{class:'axis'},svg);

    st('text',{x:left-6,y:y(t)+3.5,'text-anchor':'end'},(spec.tick||(spec.fmt===f$?fT:spec.fmt))(t),ax); });

  });

function colChart(panel, spec){

  const pw=W-lw-right, band=(H-top-bottom)/n, bh=Math.min(spec.maxBar||20, band*.66);
  const mx=Math.max(...spec.values.filter(isNum), ...(spec.marker||[]).filter(isNum), spec.max||0);

      if(t.getComputedTextLength()>lw-10){ let str=c; while(str.length>3 && t.getComputedTextLength()>lw-10){ str=str.slice(0,-2); t.textContent=str+'…'; } } }
    if(isNum(v) && v>0){ const w=Math.max(1,x(v)-lw);
      const p=s('path',{d:`M${lw},${cy-bh/2}H${lw+w-Math.min(4,w)}Q${lw+w},${cy-bh/2} ${lw+w},${cy-bh/2+Math.min(4,bh/2)}V${cy+bh/2-Math.min(4,bh/2)}Q${lw+w},${cy+bh/2} ${lw+w-Math.min(4,w)},${cy+bh/2}H${lw}Z`,fill:col},svg);
      hover(p, c, spec.tipRows ? spec.tipRows(i) : [{color:col,name:spec.name||'',value:spec.fmt(v)}]); }
    if(spec.marker && isNum(spec.marker[i])){ const mxp=x(spec.marker[i]); s('line',{x1:mxp,x2:mxp,y1:cy-bh/2-3,y2:cy+bh/2+3,stroke:'var(--ink)','stroke-width':2},svg); }

/* waterfall */
function waterfall(panel, steps){
  const host=panel.querySelector('.plot'); const {svg,W,H}=frame(host,{aria:'ARR waterfall'});
  const left=56, right=10, top=18, bottom=34, pw=W-left-right, ph=H-top-bottom, n=steps.length, band=pw/n;
  let run=0; const bars=steps.map(stp=>{ if(stp.kind==='total'){ run=stp.value; return {a:0,b:stp.value,...stp}; } const a=run; run+=stp.value; return {a,b:run,...stp}; });
  const lv=bars.filter(b=>b.kind!=='total').flatMap(b=>[b.a,b.b]).concat(bars.filter(b=>b.kind==='total').map(b=>b.b));
  const lmin=Math.min(...lv), lmax=Math.max(...lv), pad=Math.max((lmax-lmin)*0.6, lmax*0.02);
  const sc=nice(Math.max(0,lmin-pad),lmax,4); bars.forEach(b=>{ if(b.kind==='total') b.a=sc.lo; });
  panel.axisStart=sc.lo;
  const y=v=>top+ph-(v-sc.lo)/(sc.hi-sc.lo)*ph;
  const ax=s('g',{class:'axis'},svg);
  sc.ticks.forEach(t=>{ s('line',{x1:left,x2:left+pw,y1:y(t),y2:y(t),stroke:t===0?'var(--axis)':'var(--grid)','stroke-width':1},ax);
    st('text',{x:left-6,y:y(t)+3.5,'text-anchor':'end'},fT(t),ax); });
  bars.forEach((b,i)=>{
    const cx=left+band*(i+.5), bw=Math.min(24,band*.5), yt=y(Math.max(b.a,b.b)), hgt=Math.max(1,Math.abs(y(b.a)-y(b.b)));
    const col=b.kind==='total'?'var(--total)':(b.value>=0?'var(--up)':'var(--down)');
    const p=s('rect',{x:cx-bw/2,y:yt,width:bw,height:hgt,rx:2,fill:col},svg);
    hover(p,b.label,[{color:col,name:b.kind==='total'?'ARR':'Change',value:b.kind==='total'?f$(b.value):(b.value>=0?'+':'')+f$(b.value)}]);
    if(i<n-1){ const nx=left+band*(i+1.5); s('line',{x1:cx+bw/2,x2:nx-bw/2,y1:y(b.b),y2:y(b.b),stroke:'var(--axis)','stroke-width':1},svg); }
    st('text',{x:cx,y:yt-5,'text-anchor':'middle',class:b.kind==='total'?'lblb':'lbl'},b.kind==='total'?f$(b.value):((b.value>=0?'+':'')+f$(b.value)),svg);
    const words=b.label.split(' '); const l1=words.slice(0,Math.ceil(words.length/2)).join(' '), l2=words.slice(Math.ceil(words.length/2)).join(' ');
    st('text',{x:cx,y:H-bottom+14,'text-anchor':'middle',class:'lbl'},l1,svg); if(l2) st('text',{x:cx,y:H-bottom+27,'text-anchor':'middle',class:'lbl'},l2,svg);
  });
  setTable(panel,['Step','Value'],steps.map(x=>[x.label,x.kind==='total'?f$(x.value):(x.value>=0?'+':'')+f$(x.value)]));
}

/* sparkline in tile */
function spark(tile, vals){
  const W=150, H=22, v=vals.map(x=>isNum(x)?x:null), ok=v.filter(isNum); if(ok.length<2) return;
  const mn=Math.min(...ok), mx=Math.max(...ok), sv=s('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,'aria-hidden':'true'},tile);
  const x=i=>3+i*(W-6)/(v.length-1), y=a=>H-3-(mx===mn?.5:(a-mn)/(mx-mn))*(H-6); let d='',pen=false;
  v.forEach((a,i)=>{ if(isNum(a)){ d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(a).toFixed(1); pen=true;} else pen=false; });
  s('path',{d,fill:'none',stroke:'#6f82a0','stroke-width':1.5},sv);
  const li=v.length-1; if(isNum(v[li])) s('circle',{cx:x(li),cy:y(v[li]),r:3,fill:'var(--amber)'},sv);

/* ---------------- tiles, hero, deltas ---------------- */
function delta(cur, prev, kind, upGood=true){
  const el=h('span','chip');
  if(!isNum(cur)||!isNum(prev)){ el.classList.add('flat'); el.textContent='No prior-quarter comparison'; return el; }
  const d=cur-prev; let txt;
  if(kind==='$') txt=(d>=0?'+':'')+f$(d)+(prev?` (${(d/Math.abs(prev)*100>=0?'+':'')}${(d/Math.abs(prev)*100).toFixed(1)}%)`:'');
  else if(kind==='pct') txt=(d>=0?'+':'')+(d*100).toFixed(1)+' pts';
  else if(kind==='x') txt=(d>=0?'+':'')+d.toFixed(2)+'x';
  else if(kind==='days') txt=(d>=0?'+':'')+Math.round(d)+' days';
  else if(kind==='mo') txt=(d>=0?'+':'')+d.toFixed(1)+' mo';
  else txt=(d>=0?'+':'')+Math.round(d).toLocaleString('en-US')+(prev?` (${(d/Math.abs(prev)*100>=0?'+':'')}${(d/Math.abs(prev)*100).toFixed(1)}%)`:'');
  const flat=Math.abs(d)<1e-9, good=(d>0)===upGood;
  el.classList.add(flat?'flat':(good?'good':'bad'));
  el.appendChild(document.createTextNode((flat?'▶ ':(d>0?'▲ ':'▼ '))+txt+' '));
  el.appendChild(h('span','vs','vs '+QN[PREV]));
  return el;
}
function hero(root, label, value, chip, sowhat){
  const b=root.querySelector('.hero'); b.replaceChildren();
  b.appendChild(h('div','lab',label+' · '+QN[CUR])); b.appendChild(h('div','val',value));
  if(chip) b.appendChild(chip); b.appendChild(h('div','sowhat',sowhat));
}
function tile(root, label, value, chip, opts={}){
  const t=h('div','tile'); t.appendChild(h('div','lab',label));
  t.appendChild(h('div','val'+(opts.text?' txt':''),value)); if(chip) t.appendChild(chip);
  if(opts.note) t.appendChild(h('div','note',opts.note)); if(opts.spark) spark(t,opts.spark);

}

/* ---------------- metric functions ---------------- */
const stockAt=(k,rs,ps,key='arr')=>S(C.stock[key][k],rs,ps);
function mvq(q,rs,ps){ const c={}; C.mv.cats.forEach((n,i)=>c[n]=S(C.mv.v[q],rs,ps,i)); return c; }
function ret(q,rs,ps){ if(q<3) return null; const v=[0,1,2,3,4,5].map(i=>S(C.ret[q],rs,ps,i));
  return {ndr:div(v[0]+v[1]+v[2]+v[3]+v[4],v[0]), grr:div(v[0]+v[3]+v[4],v[0]), bop:v[0], logos:v[5]}; }
const wl=(q,rs,ps,k)=>S(C.wl[q],rs,ps,k);
function winRate(q,rs,ps){ return div(wl(q,rs,ps,0), wl(q,rs,ps,0)+wl(q,rs,ps,1)); }
function winRateD(q,rs,ps){ return div(wl(q,rs,ps,2), wl(q,rs,ps,2)+wl(q,rs,ps,3)); }
function quotaSum(q,rs,role,k){ return sum(C.quota.filter(r=>r[4]===q && r[2]===role && rs.includes(r[3])).map(r=>r[k])); }
function coverage(q,rs,ps,k=0){ return div(S(C.cov[q],rs,ps,k), quotaSum(q,rs,'AE',5)); }
function ttm(q,fn){ if(q<3) return null; let t=0; for(let j=q-3;j<=q;j++) t+=fn(j); return t; }
function unitEcon(q,rs,ps,prodF){
  if(q<3) return {};
  const logos=ttm(q,j=>wl(j,rs,ps,0)), wonArr=ttm(q,j=>wl(j,rs,ps,2));
  const gm=1-div(ttm(q,j=>S(C.gm[j],rs,ps,1)), ttm(q,j=>S(C.gm[j],rs,ps,0)));
  const acv=div(wonArr,logos), r=ret(q,rs,ps), churn=div(ttm(q,j=>S(C.churnN[j],rs,ps)), r.logos);
  const arpa=div(stockAt(q+1,rs,ps), stockAt(q+1,rs,ps,'cust'));
  const ltv=(isNum(arpa)&&isNum(gm)&&churn)?arpa*gm/churn:null;
  if(prodF) return {acv,gm,ltv,arpa,churn};
  const sm=ttm(q,j=>sum(rs.map(i=>C.pnl[j][i][4])));
  const cac=div(sm,logos), payback=(isNum(cac)&&isNum(acv)&&isNum(gm))?cac/(acv*gm/12):null;
  return {acv,gm,ltv,arpa,churn,sm,cac,payback,ltvcac:div(ltv,cac)};
}

{nav:'Win / Loss', title:'Win/Loss & Competitive Analysis', q:'Why do we win and lose, and against whom?',

{nav:'Quota', title:'Sales Execution: Quota & Productivity', q:"Is the sales team hitting plan, and who's driving it?",

{nav:'Pricing', title:'Pricing & Discount Analysis', q:'Are we giving away margin through discounting?',

 render(f,root){

  panelTitle(pb,'Churned logos by reason','Count, by quarter');
  colChart(pb,{cats:qs.map(q=>QN[q]),fmt:fN,mode:'stack',series:C.churnR.names.map((n,k)=>({name:n.split(' / ')[0],color:HEX[k],values:qs.map(q=>S(C.churnR.v[q],rs,ps,k))}))});
  const ks=C.coh.ks; const cv=C.coh.years.map((y,ci)=>({name:y+' cohort',color:HEX[ci],values:ks.map((k,j)=>{ let b=0,v=0; for(const r of rs) for(const p of ps){ b+=C.coh.v[ci][r][p][j][0]; v+=C.coh.v[ci][r][p][j][1]; } return b?v/b:null; })}));
  panelTitle(pc,'Cohort ARR retention','ARR vs go-live ARR, by months since go-live');
  lineChart(pc,{cats:ks.map(k=>k+'m'),fmt:v=>fP(v,0),zero:false,endLabels:false,series:cv});
 }},
{nav:'Unit Econ', title:'Unit Economics: LTV/CAC & Cross-Sell', q:'Is customer acquisition and services attach economically sound?',
 filters:['region','plan','seg','range'], layout:'A|B2',
 note:'Trailing twelve months. LTV = ARPA × SaaS GM ÷ annual logo churn. CAC = S&M ÷ new logos won (blended). S&M is booked by region, so CAC-based measures show n/a under a product or segment filter.',
 render(f,root){
  const rs=regs(f), ps=plans(f), pf=prodFiltered(f), qs=qRange(f);
  const u1=unitEcon(CUR,rs,ps,pf), u0=unitEcon(PREV,rs,ps,pf);
  if(pf) hero(root,'Customer lifetime value (TTM)',f$(u1.ltv),delta(u1.ltv,u0.ltv,'$'),`LTV of ${f$(u1.ltv)} on ${fP(u1.gm)} SaaS margin; LTV/CAC needs S&M, which is booked by region only.`);
  else hero(root,'LTV / CAC (TTM)',fX(u1.ltvcac),delta(u1.ltvcac,u0.ltvcac,'x'),`Each acquisition dollar returns ${fX(u1.ltvcac)} in lifetime gross profit; CAC pays back in ${fM(u1.payback)}.`);
  if(pf){ tile(root,'CAC payback','n/a',null,{note:'S&M is booked by region'}); tile(root,'Blended CAC','n/a',null,{note:'S&M is booked by region'}); }
  else { tile(root,'CAC payback',fM(u1.payback),delta(u1.payback,u0.payback,'mo',false)); tile(root,'Blended CAC',f$(u1.cac),delta(u1.cac,u0.cac,'$',false)); }
  const acv=q=>div(wl(q,rs,ps,2),wl(q,rs,ps,0)); tile(root,'Average new-logo ACV',f$(acv(CUR)),delta(acv(CUR),acv(PREV),'$'));
  const at=(q,pp=ps)=>div(S(C.wl[q],rs,pp,6),S(C.wl[q],rs,pp,0)); tile(root,'PS attach rate (won new logos)',fP(at(CUR)),delta(at(CUR),at(PREV),'pct'));
  const [pa,pb,pc]=root.panels;
  if(pf){ panelTitle(pa,'Customer lifetime value (TTM)','By quarter'); lineChart(pa,{cats:qs.map(q=>QN[q]),fmt:f$,series:[{name:'LTV',color:HEX[0],values:qs.map(q=>unitEcon(q,rs,ps,true).ltv)}]}); }
  else { panelTitle(pa,'LTV / CAC (TTM)','By quarter end; first available Q4 ’23'); lineChart(pa,{cats:qs.map(q=>QN[q]),fmt:fX,series:[{name:'LTV/CAC',color:HEX[0],values:qs.map(q=>unitEcon(q,rs,ps,false).ltvcac)}]}); }
  const t4=range(CUR-3,CUR); const pv=ps.map(p=>div(sum(t4.map(q=>S(C.wl[q],rs,[p],6))),sum(t4.map(q=>S(C.wl[q],rs,[p],0)))));
  panelTitle(pb,'PS attach rate by plan (TTM)','Won new logos that bought services');
  hbarChart(pb,{cats:ps.map(p=>PLN[p]),values:pv,fmt:fP,color:ps.map(p=>HEX[p]),labelW:52,max:1,name:'Attach rate',tableCols:['Plan','Attach rate'],tableRow:i=>[PLN[ps[i]],fP(pv[i])]});
  panelTitle(pc,'Average new-logo ACV by plan','By quarter');
  lineChart(pc,{cats:qs.map(q=>QN[q]),fmt:f$,endLabels:false,series:ps.map(p=>({name:PLN[p],color:HEX[p],values:qs.map(q=>div(S(C.wl[q],rs,[p],2),S(C.wl[q],rs,[p],0)))}))});
 }}
];

/* ---------------- build DOM ---------------- */
const FILTER_DEF={
  region:{label:'Region',opts:[['All','All regions'],...REG.map(r=>[r,r])],def:'All'},
  plan:{label:'Product',opts:[['All','All plans'],...PLN.map(p=>[p,p])],def:'All'},
  seg:{label:'Segment',opts:[['All','All segments'],['SMB','SMB'],['Mid-Market','Mid-Market'],['Enterprise','Enterprise']],def:'All'},
  role:{label:'Role',opts:[['AE','AE (new logo)'],['AM','AM (expansion)']],def:'AE'},
  channel:{label:'Channel',opts:[['All','All channels'],...CHN.map(c=>[c,c])],def:'All'},
  range:{label:'Trend window',opts:RANGE_OPTS.map(([v,l])=>[String(v),l]),def:'8'}
};
const canvas=document.getElementById('canvas'), nav=document.getElementById('nav');
let current=0; const roots=[];
const brand=h('div','brand'); brand.appendChild(h('b',null,'Sales & Marketing QBR')); brand.appendChild(document.createTextNode(QN[CUR]+' vs '+QN[PREV])); nav.appendChild(brand);
const prevB=h('button','arrow','‹'); prevB.setAttribute('aria-label','Previous slide'); nav.appendChild(prevB);
const navBtns=SLIDES.map((d,i)=>{ const b=h('button','navbtn'); b.appendChild(h('span','n',String(i+1).padStart(2,'0'))); b.appendChild(document.createTextNode(d.nav)); b.addEventListener('click',()=>go(i)); nav.appendChild(b); return b; });
const nextB=h('button','arrow','›'); nextB.setAttribute('aria-label','Next slide'); nav.appendChild(nextB);
nav.appendChild(h('div','spacer')); const pr=h('button','printbtn','Print / PDF'); pr.addEventListener('click',()=>window.print()); nav.appendChild(pr);
prevB.addEventListener('click',()=>go(current-1)); nextB.addEventListener('click',()=>go(current+1));

SLIDES.forEach((d,i)=>{
  const sl=h('section','slide'); sl.setAttribute('aria-label',`Slide ${i+1}: ${d.title}`);
  const hd=h('div','hdr'), l=h('div'); l.appendChild(h('div','kicker',String(i+1).padStart(2,'0')+' · '+d.nav)); l.appendChild(h('div','title',d.title)); l.appendChild(h('div','q',d.q)); hd.appendChild(l);
  const fl=h('div','filters'); const state={};
  d.filters.forEach(k=>{ const fd=FILTER_DEF[k]; const lab=h('label',null,fd.label); const se=h('select'); fd.opts.forEach(([v,t])=>{ const o=h('option',null,t); o.value=v; se.appendChild(o); });
    se.value=fd.def; state[k]=k==='range'?+fd.def:fd.def; se.addEventListener('change',()=>{ state[k]=k==='range'?+se.value:se.value; draw(i); }); lab.appendChild(se); fl.appendChild(lab); });
  hd.appendChild(fl); sl.appendChild(hd);
  const body=h('div','body'), left=h('div','left'); left.appendChild(h('div','hero')); left.appendChild(h('div','tiles')); body.appendChild(left);
  const right=h('div','right'); const mk=()=>{ const p=h('div','panel'); const ph=h('div','ph'), tt=h('div'); tt.appendChild(h('div','pt')); tt.appendChild(h('div','ps')); ph.appendChild(tt);
    const btn=h('button','ctl','Table'); btn.addEventListener('click',()=>{ p.classList.toggle('showtbl'); btn.textContent=p.classList.contains('showtbl')?'Chart':'Table'; }); ph.appendChild(btn); p.appendChild(ph);
    const plot=h('div','plot'); plot.appendChild(h('div','tbl')); p.appendChild(plot); return p; };
  const pa=mk(); right.appendChild(pa); const panels=[pa];
  if(d.layout==='L') right.classList.add('L');
  if(d.layout==='A|B2'||d.layout==='L'){ const r2=h('div','row2'); const pb=mk(), pc=mk(); r2.appendChild(pb); r2.appendChild(pc); right.appendChild(r2); panels.push(pb,pc); }
  else { const pb=mk(); right.appendChild(pb); panels.push(pb); }
  body.appendChild(right); sl.appendChild(body);
  const ft=h('div','foot'); ft.appendChild(h('span',null,'Source: '+M.source+' · Data as of '+M.asOf+' · '+d.note));
  ft.appendChild(h('span','tagline','© Maulik Nagri · AIFC Accelerator Week 3 Project · Sales Metrics Dashboard · Synthetic Data · Do not distribute'));
  ft.appendChild(h('span',null,(i+1)+' / '+SLIDES.length)); sl.appendChild(ft);
  canvas.appendChild(sl); roots.push({el:sl,state,panels});
});
function draw(i){
  const r=roots[i], d=SLIDES[i]; r.el.querySelector('.tiles').replaceChildren();
  r.panels.forEach(p=>{ const plot=p.querySelector('.plot'); const tb=p.querySelector('.tbl'); plot.replaceChildren(tb); });
  const api={panels:r.panels, querySelector:q=>r.el.querySelector(q)};
  // render with plot hosts that keep the table box
  r.panels.forEach(p=>{ const plot=p.querySelector('.plot'); const inner=h('div'); inner.style.cssText='position:absolute;inset:0'; plot.appendChild(inner); p._plot=inner; });
  const wrapped=r.panels.map(p=>({querySelector:q=>q==='.plot'?p._plot:p.querySelector(q)}));
  try { d.render(r.state,{panels:wrapped,querySelector:q=>r.el.querySelector(q)}); }
  catch(e){ console.error('Slide '+(i+1)+' render failed', e); }
}
function go(i){ i=Math.max(0,Math.min(SLIDES.length-1,i)); roots[current].el.classList.remove('active'); navBtns[current].removeAttribute('aria-current');
  current=i; roots[i].el.classList.add('active'); navBtns[i].setAttribute('aria-current','true'); navBtns[i].scrollIntoView({block:'nearest',inline:'nearest'}); hideTip();
  try{ history.replaceState(null,'','#'+(i+1)); }catch(e){} }
function fit(){ const stage=document.getElementById('stage'); const top=nav.offsetHeight; const W=innerWidth, H=innerHeight-top;
  const sc=Math.min((W-24)/1280,(H-24)/720); stage.style.height=H+'px';
  canvas.style.transform=`translate(${(W-1280*sc)/2}px,${(H-720*sc)/2}px) scale(${sc})`; }
addEventListener('resize',fit);
addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT') return; if(e.key==='ArrowRight'||e.key==='PageDown') go(current+1); else if(e.key==='ArrowLeft'||e.key==='PageUp') go(current-1);
  else if(e.key==='Home') go(0); else if(e.key==='End') go(SLIDES.length-1); else if(/^[0-9]$/.test(e.key)) go(e.key==='0'?9:+e.key-1); });
fit(); SLIDES.forEach((_,i)=>draw(i));
const start=parseInt((location.hash||'').slice(1),10); roots[0].el.classList.add('active'); navBtns[0].setAttribute('aria-current','true'); if(start>=1&&start<=10) go(start-1);
</script>
</body>
</html>
